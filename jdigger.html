<body id='body'>
	<h1 style="position:absolute;left:-9999px;top:auto">Digger – Klassisches KC85 Retro-Spiel</h1>
	<noscript>
		<p><strong>Digger</strong> – das originale Arcade-Spiel aus der KC85/3- und KC85/4-Ära (1988, Alexander Lang / Stefan Dahlke).
		Sammle Diamanten, weiche den Monstern aus und meistere 80 Level. Steuerung: Pfeiltasten, Touch oder Gamepad.
		Dieses Browser-Spiel benötigt aktiviertes JavaScript.</p>
	</noscript>
	<!-- Menu Canvas -->
	<div id='menudiv'>
		<canvas id='menuimg' moz-opaque></canvas>
		<!-- Rechtliche Links -->
		<div id="legal" style="position:absolute;bottom:8px;left:0;right:0;text-align:center;z-index:1;
			font-family:'KC85','Courier New',monospace;font-size:16px;line-height:1;letter-spacing:0">
			<span id="legal_imp"><a href="../impressum.html">Impressum</a></span><span id="legal_sep">&nbsp;·&nbsp;</span><span id="legal_dat"><a href="../datenschutz.html">Datenschutz</a></span>
		</div>
	</div>

	<div id='gamediv'>
		<!-- Score Display -->
		<div id='scorelinediv'>
			<canvas id='scoreline' moz-opaque></canvas>
		</div>
		<!-- Game Field -->
		<div id='diggerdiv'>
			<canvas id='digger' moz-opaque></canvas>
		</div>
	</div>
	
	<!-- Virtual Keyboard Input -->
	<input id='virt_kbd'>
	
	<!-- Game Scripts -->
	<script src="header.js?v=3"></script>
	<script src="levels30_map.js?v=3"></script> <!-- Levels: from "xdigger": xd1,xd2 from "lanale.de": 30,50,68,80 -->
	<script src="audio.js?v=3"></script>
	<script src="keyboard.js?v=3"></script>
	<script src="touch.js?v=3"></script>
	<script src="gamepad.js?v=3"></script>
	<script src="mouse.js?v=3"></script>
	<script src="jdigger.js?v=3"></script>
	<script>
		// Rechtliche Links: exakt die Spiel-Skalierung (scale/4), stufenlos
		function fit_legal() {
			var scale = Math.max(window.innerWidth / 20, window.innerHeight / 15);
			var el = document.getElementById('legal');
			if (el) el.style.fontSize = Math.max(8, scale / 4) + 'px';
		}
		window.addEventListener('resize', fit_legal);
		window.addEventListener('orientationchange', fit_legal);
		fit_legal();

		// Rechtliche Links nur anzeigen, wenn die Zieldatei existiert.
		// 404 -> Link ausblenden; Zugriffsfehler (z.B. file://) -> Link stehen lassen.
		function check_legal(id, url) {
			fetch(url, { method: 'HEAD' }).then(function(r) {
				if (!r.ok) throw new Error('fehlt');
			}).catch(function(e) {
				if (e.message !== 'fehlt') return;   // Netzwerkfehler -> nichts verstecken
				var el = document.getElementById(id);
				if (el) el.style.display = 'none';
				var imp = document.getElementById('legal_imp');
				var dat = document.getElementById('legal_dat');
				var sep = document.getElementById('legal_sep');
				if (sep && (!imp || imp.style.display === 'none' ||
				            !dat || dat.style.display === 'none')) sep.style.display = 'none';
			});
		}
		// Check nur ueber HTTP(S) - auf file:// wuerde fetch blockiert (Konsolen-Fehler)
		if (location.protocol === 'http:' || location.protocol === 'https:') {
			check_legal('legal_imp', '../impressum.html');
			check_legal('legal_dat', '../datenschutz.html');
		}
	</script>
